<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Model / Image -> Vortex</title>

<style>
:root{
  --bg:#0b0f14;
  --panel:#111822;
  --panel2:#0e141d;
  --text:#e7eef7;
  --muted:#8fa2b7;
  --accent:#6aa8ff;
  --border:#243244;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

header{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
}

h1{
  margin:0;
  font-size:18px;
}

main{
  display:grid;
  grid-template-columns:330px 1fr;
  height:calc(100vh - 54px);
}

#controls{
  padding:14px;
  overflow:auto;
  background:var(--panel2);
  border-right:1px solid var(--border);
}

label{
  display:block;
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}

input,select,button{
  width:100%;
  margin-top:5px;
  padding:8px;
  border:1px solid var(--border);
  border-radius:6px;
  background:#0b1119;
  color:var(--text);
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.drop{
  padding:20px 10px;
  margin-bottom:12px;
  text-align:center;
  border:1px dashed #3b5068;
  border-radius:8px;
  color:var(--muted);
  cursor:pointer;
}

.drop.drag{
  border-color:var(--accent);
  color:var(--text);
}

#viewer{
  position:relative;
  min-width:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#status{
  position:absolute;
  left:12px;
  bottom:12px;
  padding:7px 10px;
  border-radius:6px;
  background:rgba(0,0,0,.55);
  font-size:12px;
  color:var(--muted);
}

textarea{
  width:100%;
  height:180px;
  margin-top:10px;
  resize:vertical;
  background:#080c11;
  color:#cfe3ff;
  border:1px solid var(--border);
  border-radius:6px;
  padding:8px;
  font-family:monospace;
  font-size:11px;
}
</style>
</head>

<body>

<header>
  <h1>3D Model / Image → Vortex</h1>
</header>

<main>

<div id="controls">

  <div id="drop" class="drop">
    Put 3D model or image here<br>
    or click
  </div>

  <input
    id="file"
    type="file"
    hidden
    accept=".glb,.gltf,.obj,.stl,.fbx,.png,.jpg,.jpeg,.webp"
  >

  <label>Project ID</label>
  <input id="project" value="MyProject">

  <label>Model name</label>
  <input id="name" value="Model">

  <label>Detail res</label>
  <input id="res" type="number" value="32" min="2" max="128">

  <label>Size</label>
  <input id="size" type="number" value="20" min="1">

  <label>Minimum part size</label>
  <input id="minPart" type="number" value="1" min="0">

  <label>Anchored</label>
  <select id="anchored">
    <option value="true">true</option>
    <option value="false">false</option>
  </select>

  <label>CanCollide</label>
  <select id="collide">
    <option value="true">true</option>
    <option value="false">false</option>
  </select>

  <label>CastShadow</label>
  <select id="shadow">
    <option value="true">true</option>
    <option value="false">false</option>
  </select>

  <label>Studs top</label>
  <input id="studTop" type="number" value="0">

  <label>Inlets bottom</label>
  <input id="inletBottom" type="number" value="0">

  <label>Studs bottom</label>
  <input id="studBottom" type="number" value="0">

  <label>Inlets top</label>
  <input id="inletTop" type="number" value="0">

  <label>Material</label>
  <select id="material">
    <option>Plastic</option>
    <option>Concrete</option>
    <option>Metal</option>
    <option>Glass</option>
    <option>Wood</option>
  </select>

  <label>Theme</label>
  <select id="theme">
    <option value="dark">Dark</option>
    <option value="light">Light</option>
  </select>

  <button id="convert" disabled>Convert</button>
  <button id="download" disabled>Download JSON</button>
  <button id="lua">Load Vortexian model</button>

  <button id="wire">Toggle wireframe</button>

  <textarea id="output" readonly></textarea>

  <div id="status">Waiting for file...</div>

</div>

<div id="viewer"></div>

</main>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

import {OBJLoader} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/OBJLoader.js";

import {STLLoader} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/STLLoader.js";

import {FBXLoader} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js";


const $ = id => document.getElementById(id);

let source = null;
let sourceType = "model";
let result = null;
let fileName = "";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50,
  1,
  .1,
  10000
);

camera.position.set(80,60,80);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(
  $("viewer").clientWidth,
  $("viewer").clientHeight
);

$("viewer").appendChild(renderer.domElement);

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff,.6));

const light = new THREE.DirectionalLight(
  0xffffff,
  1.5
);

light.position.set(50,80,30);
scene.add(light);

const grid = new THREE.GridHelper(
  200,
  40,
  0x334455,
  0x22303d
);

scene.add(grid);


function status(text){
  $("status").textContent = text;
}


function frame(obj){

  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  const max = Math.max(size.x,size.y,size.z);

  obj.position.sub(center);

  camera.position.set(
    max*1.8,
    max*1.4,
    max*1.8
  );

  controls.target.set(0,0,0);
  controls.update();
}


function loadImage(file){

  return new Promise((resolve,reject)=>{

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = ()=>{

      URL.revokeObjectURL(url);

      resolve(img);
    };

    img.onerror = ()=>{

      URL.revokeObjectURL(url);

      reject(new Error("Could not load image"));
    };

    img.src = url;
  });
}


async function load(file){

  fileName = file.name;

  const ext = file.name
    .split(".")
    .pop()
    .toLowerCase();


  // IMAGE
  if(["png","jpg","jpeg","webp"].includes(ext)){

    source = await loadImage(file);

    // IMPORTANT:
    // source is now a real HTMLImageElement.
    // drawImage(source, ...) will work.
    sourceType = "image";

    $("convert").disabled = false;

    status(
      `Image loaded: ${file.name} (${source.width}x${source.height})`
    );

    return;
  }


  // MODEL
  sourceType = "model";

  if(source && source.isObject3D){
    scene.remove(source);
  }

  let object;


  if(ext === "glb" || ext === "gltf"){

    const loader = new GLTFLoader();

    const gltf = await new Promise((resolve,reject)=>{

      loader.load(
        URL.createObjectURL(file),
        resolve,
        undefined,
        reject
      );

    });

    object = gltf.scene;

  }else if(ext === "obj"){

    const loader = new OBJLoader();

    object = await new Promise((resolve,reject)=>{

      loader.load(
        URL.createObjectURL(file),
        resolve,
        undefined,
        reject
      );

    });

  }else if(ext === "stl"){

    const loader = new STLLoader();

    const geometry = await new Promise((resolve,reject)=>{

      loader.load(
        URL.createObjectURL(file),
        resolve,
        undefined,
        reject
      );

    });

    object = new THREE.Mesh(
      geometry,
      new THREE.MeshStandardMaterial({
        color:0xffffff
      })
    );

  }else if(ext === "fbx"){

    const loader = new FBXLoader();

    object = await new Promise((resolve,reject)=>{

      loader.load(
        URL.createObjectURL(file),
        resolve,
        undefined,
        reject
      );

    });

  }else{

    throw new Error("Unsupported file type");
  }


  source = object;

  scene.add(source);

  frame(source);

  $("convert").disabled = false;

  status(`Model loaded: ${file.name}`);
}


$("drop").onclick = () => $("file").click();


$("file").onchange = async e => {

  if(!e.target.files[0]) return;

  try{

    await load(e.target.files[0]);

  }catch(err){

    console.error(err);

    status("Load error: " + err.message);
  }
};


$("drop").ondragover = e => {

  e.preventDefault();

  $("drop").classList.add("drag");
};


$("drop").ondragleave = () => {

  $("drop").classList.remove("drag");
};


$("drop").ondrop = async e => {

  e.preventDefault();

  $("drop").classList.remove("drag");

  const file = e.dataTransfer.files[0];

  if(!file) return;

  try{

    await load(file);

  }catch(err){

    console.error(err);

    status("Load error: " + err.message);
  }
};


function triangles(obj){

  const out = [];

  obj.updateMatrixWorld(true);

  obj.traverse(o => {

    if(!o.isMesh) return;

    const geometry = o.geometry;

    const pos = geometry.attributes.position;

    if(!pos) return;

    const index = geometry.index;

    const a = new THREE.Vector3();
    const b = new THREE.Vector3();
    const c = new THREE.Vector3();

    const matrix = o.matrixWorld;

    const count = index
      ? index.count
      : pos.count;


    for(let i=0;i<count;i+=3){

      const ia = index ? index.getX(i) : i;
      const ib = index ? index.getX(i+1) : i+1;
      const ic = index ? index.getX(i+2) : i+2;

      a.fromBufferAttribute(pos,ia).applyMatrix4(matrix);
      b.fromBufferAttribute(pos,ib).applyMatrix4(matrix);
      c.fromBufferAttribute(pos,ic).applyMatrix4(matrix);

      out.push([a.clone(),b.clone(),c.clone()]);
    }
  });

  return out;
}


const ray = new THREE.Ray();


function voxelize(obj){

  const tris = triangles(obj);

  const box = new THREE.Box3().setFromObject(obj);

  const size = box.getSize(new THREE.Vector3());

  const res = Math.max(
    2,
    Number($("res").value) || 32
  );

  const maxSize = Math.max(
    size.x,
    size.y,
    size.z
  );

  const cell = maxSize / res;

  const min = box.min.clone();

  const voxels = [];

  for(let x=0;x<res;x++){

    for(let y=0;y<res;y++){

      for(let z=0;z<res;z++){

        const center = new THREE.Vector3(
          min.x + (x+.5)*cell,
          min.y + (y+.5)*cell,
          min.z + (z+.5)*cell
        );

        ray.origin.copy(center);

        ray.direction.set(1,0,0);

        let hits = 0;

        for(const t of tris){

          const hit = ray.intersectTriangle(
            t[0],
            t[1],
            t[2],
            false,
            new THREE.Vector3()
          );

          if(hit) hits++;
        }

        if(hits % 2 === 1){

          voxels.push({
            x,
            y,
            z,
            center,
            size:cell
          });
        }
      }
    }
  }

  return voxels;
}


function merge(voxels){

  const parts = [];

  const minPart =
    Number($("minPart").value) || 1;

  const size =
    Number($("size").value) || 20;

  if(!voxels.length) return parts;

  const box = new THREE.Box3();

  for(const v of voxels){

    box.expandByPoint(v.center);
  }

  const boxSize =
    box.getSize(new THREE.Vector3());

  const scale =
    size /
    Math.max(
      boxSize.x,
      boxSize.y,
      boxSize.z,
      .001
    );


  for(const v of voxels){

    const s = Math.max(
      v.size * scale,
      minPart
    );

    parts.push({

      name:
        `${$("name").value}_${parts.length}`,

      position:{
        x:+(v.center.x * scale).toFixed(4),
        y:+(v.center.y * scale).toFixed(4),
        z:+(v.center.z * scale).toFixed(4)
      },

      rotation:{
        x:0,
        y:0,
        z:0,
        w:1
      },

      scale:{
        x:+s.toFixed(4),
        y:+s.toFixed(4),
        z:+s.toFixed(4)
      },

      color:{
        r:1,
        g:1,
        b:1,
        a:1
      },

      material:$("material").value,

      group:"",

      cast_shadow:
        $("shadow").value === "true",

      anchored:
        $("anchored").value === "true",

      can_collide:
        $("collide").value === "true",

      spawn_:false,

      baseplate:false,

      truss:false,

      textures:{
        top:{
          studs:Number($("studTop").value)||0,
          inlets:Number($("inletTop").value)||0
        },

        bottom:{
          studs:Number($("studBottom").value)||0,
          inlets:Number($("inletBottom").value)||0
        }
      }
    });
  }

  return parts;
}


/*
  IMAGE -> PARTS

  The image itself is NOT placed into the JSON.

  Every visible pixel becomes a normal Vortex part.
*/
async function imageToParts(img){

  const max =
    Math.max(
      1,
      Number($("res").value) || 32
    );

  const aspect =
    img.width / img.height;

  let w;
  let h;


  if(img.width >= img.height){

    w = max;

    h = Math.max(
      1,
      Math.round(max / aspect)
    );

  }else{

    h = max;

    w = Math.max(
      1,
      Math.round(max * aspect)
    );
  }


  const canvas =
    document.createElement("canvas");

  canvas.width = w;
  canvas.height = h;


  const ctx =
    canvas.getContext(
      "2d",
      {willReadFrequently:true}
    );


  // FIX:
  // img is the actual HTMLImageElement.
  ctx.drawImage(
    img,
    0,
    0,
    w,
    h
  );


  const data =
    ctx.getImageData(
      0,
      0,
      w,
      h
    ).data;


  const size =
    Number($("size").value) || 20;


  const partSize =
    size / Math.max(w,h);


  const parts = [];


  for(let y=0;y<h;y++){

    for(let x=0;x<w;x++){

      const i =
        (y*w+x)*4;


      const r = data[i];
      const g = data[i+1];
      const b = data[i+2];
      const a = data[i+3];


      // Ignore transparent pixels.
      if(a < 10) continue;


      const px =
        (x - (w-1)/2) *
        partSize;

      const py =
        ((h-1-y) - (h-1)/2) *
        partSize;


      parts.push({

        name:
          `${$("name").value}_${parts.length}`,

        position:{
          x:+px.toFixed(4),
          y:+py.toFixed(4),
          z:0
        },

        rotation:{
          x:0,
          y:0,
          z:0,
          w:1
        },

        scale:{
          x:partSize,
          y:partSize,
          z:partSize
        },

        color:{
          r:r/255,
          g:g/255,
          b:b/255,
          a:a/255
        },

        material:$("material").value,

        group:"",

        cast_shadow:
          $("shadow").value === "true",

        anchored:
          $("anchored").value === "true",

        can_collide:
          $("collide").value === "true",

        spawn_:false,

        baseplate:false,

        truss:false,

        textures:{
          top:{
            studs:Number($("studTop").value)||0,
            inlets:Number($("inletTop").value)||0
          },

          bottom:{
            studs:Number($("studBottom").value)||0,
            inlets:Number($("inletBottom").value)||0
          }
        }
      });
    }
  }


  return parts;
}


function showParts(parts){

  if(window.__previewParts){

    scene.remove(
      window.__previewParts
    );
  }


  const group =
    new THREE.Group();


  for(const p of parts){

    const geometry =
      new THREE.BoxGeometry(
        p.scale.x,
        p.scale.y,
        p.scale.z
      );


    const material =
      new THREE.MeshStandardMaterial({

        color:
          new THREE.Color(
            p.color.r,
            p.color.g,
            p.color.b
          ),

        transparent:
          p.color.a < 1,

        opacity:
          p.color.a
      });


    const mesh =
      new THREE.Mesh(
        geometry,
        material
      );


    mesh.position.set(
      p.position.x,
      p.position.y,
      p.position.z
    );


    group.add(mesh);
  }


  scene.add(group);

  window.__previewParts = group;

  frame(group);
}


$("convert").onclick = async ()=>{

  if(!source) return;


  try{

    status("Converting...");

    let parts;


    if(sourceType === "image"){

      parts =
        await imageToParts(source);

    }else{

      const v =
        voxelize(source);

      parts =
        merge(v);
    }


    result = {

      project_id:
        $("project").value,

      parts,

      lights:[{

        name:"Light",

        position:{
          x:50,
          y:80,
          z:30
        },

        rotation:{
          x:-.39447,
          y:.43917,
          z:.22335,
          w:.77565
        },

        color:{
          r:.2,
          g:.2,
          b:.2,
          a:1
        },

        illuminance:10000,

        shadows_enabled:true
      }],

      groups:[]
    };


    $("output").value =
      JSON.stringify(
        result,
        null,
        2
      );


    $("download").disabled = false;

    showParts(parts);

    status(
      `Done. ${parts.length} parts created.`
    );


  }catch(err){

    console.error(err);

    status(
      "Conversion error: " +
      err.message
    );
  }
};


$("download").onclick = ()=>{

  if(!result) return;


  const blob =
    new Blob(
      [
        JSON.stringify(
          result,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    fileName.replace(
      /\.[^.]+$/,
      ""
    ) + ".json";

  a.click();

  URL.revokeObjectURL(url);
};


$("lua").onclick = async ()=>{

  try{

    const loader =
      new GLTFLoader();


    const gltf =
      await new Promise(
        (resolve,reject)=>{

          loader.load(
            "./VortexV6IKMALE.glb",
            resolve,
            undefined,
            reject
          );

        }
      );


    if(source && source.isObject3D){

      scene.remove(source);
    }


    source =
      gltf.scene;

    sourceType =
      "model";


    scene.add(source);

    frame(source);

    $("convert").disabled = false;

    status(
      "Vortexian model loaded."
    );


  }catch(err){

    console.error(err);

    status(
      "Could not load Vortexian model."
    );
  }
};


let wireframe = false;


$("wire").onclick = ()=>{

  wireframe =
    !wireframe;


  if(window.__previewParts){

    window.__previewParts.traverse(
      o => {

        if(o.material){

          o.material.wireframe =
            wireframe;
        }
      }
    );
  }
};


$("theme").onchange = ()=>{

  if($("theme").value === "light"){

    scene.background =
      new THREE.Color(0xe8edf2);

  }else{

    scene.background =
      new THREE.Color(0x0b0f14);
  }
};


window.addEventListener(
  "resize",
  ()=>{

    const w =
      $("viewer").clientWidth;

    const h =
      $("viewer").clientHeight;


    camera.aspect =
      w/h;

    camera.updateProjectionMatrix();

    renderer.setSize(
      w,
      h
    );
  }
);


function animate(){

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );
}


animate();

</script>

</body>
</html>
